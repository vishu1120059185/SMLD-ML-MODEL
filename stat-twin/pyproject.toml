[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stattwin"
version = "0.1.0"
description = "Statistical Digital Twin for Probabilistic Failure Forecasting and Predictive Maintenance"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "torch>=2.0",
    "streamlit>=1.30",
    "plotly>=5.18",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "pyarrow>=14.0",
    "ruff>=0.1",
    "pytest>=7.4",
    "shap>=0.43",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = ["pytest-cov", "pytest-xdist"]

[project.scripts]
stattwin = "stattwin.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "leakage: Leakage Guard tests",
    "slow: marks tests as slow",
]

[tool.ruff.format]
quote-style = "double"
