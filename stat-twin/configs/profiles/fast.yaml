# Fast profile - development loop
extends: ../base.yaml
seed: 42
dataset:
  name: FD001
  raw_dir: data/raw/CMAPSS
  rul_clip: 125
  use_age_feature: false
split:
  scheme: group_kfold
  n_splits: 3
  group_col: unit_id
model:
  gru:
    # fast profile = development loop: a single small GRU keeps every
    # neural model in the seconds-to-minutes range.  `full` keeps the
    # wide, 5-seed, 50-epoch configuration used for the final report.
    hidden: 32
    layers: 1
    dropout: 0.1
    ensemble_size: 1
    epochs: 12
    patience: 3
  xgb:
    n_estimators: 400
    max_depth: 5
    learning_rate: 0.05
  rf:
    n_estimators: 200
    max_depth: 10
  lr:
    C: 1.0
    max_iter: 1000
  lstm:
    hidden: 32
    layers: 1
    dropout: 0.1
    ensemble_size: 1
  ensemble:
    members: [logistic, random_forest, xgboost]
    weights: learned
    val_fraction: 0.2
  feature_screen:
    enabled: true
    top_k: 300
    method: correlation
    min_keep: 30
